name: build

# Builds our Vivecraft jar and a patched QuestCraft APK that bundles it.
# Artifacts: the jar, the APK in two variants (replace / side-by-side), and reports.
# Pushing a tag `mihail.N` also publishes them as a GitHub release for sideloading.

on:
  push:
    branches: [main, 'integration/**', 'perf/**']
    tags: ['mihail.*']
  workflow_dispatch:
    inputs:
      qc_release_tag:
        description: QuestCraftPlusPlus/QuestCraft release tag to patch (empty = latest)
        required: false
      qc_apk_url:
        description: Direct URL of the QuestCraft APK to patch (overrides the release lookup)
        required: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  QC_REPO: QuestCraftPlusPlus/QuestCraft
  VIVECRAFT_RELEASE_REPO: QuestCraftPlusPlus/VivecraftMod
  VIVECRAFT_RELEASE_TAG: 1.21.5-1.2.5-OpenXR

jobs:
  vivecraft:
    runs-on: ubuntu-latest
    outputs:
      mod_version: ${{ steps.meta.outputs.mod_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
          add-job-summary: never
      - name: Build Fabric jar
        working-directory: vivecraft
        run: |
          # compiler errors go last, so they are in the tail of the job log
          set -o pipefail
          bash ./gradlew :fabric:build --no-daemon 2>&1 | tee ../build.log || {
            echo "=== BUILD ERRORS ==="
            grep -E '\.java:[0-9]+: error:|^e: |What went wrong' -A3 ../build.log | grep -v -E '^\s+at ' | head -200
            exit 1
          }
      - name: Locate jar
        id: meta
        run: |
          v=$(grep '^mod_version=' vivecraft/gradle.properties | cut -d= -f2)
          jar=$(ls vivecraft/fabric/build/libs/*-fabric.jar | grep -v -E -- '-(sources|dev|dev-shadow)\.jar$' | head -1)
          echo "mod_version=$v" >> "$GITHUB_OUTPUT"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          echo "### Vivecraft \`$v\`" >> "$GITHUB_STEP_SUMMARY"
          ls -l vivecraft/fabric/build/libs/ | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compare with the QuestCraft release jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$VIVECRAFT_RELEASE_TAG" -R "$VIVECRAFT_RELEASE_REPO" -p '*fabric*.jar' -D release
          mkdir -p report
          python3 apk/compare_jars.py "${{ steps.meta.outputs.jar }}" release/*.jar | tee report/jar-compare.md >> "$GITHUB_STEP_SUMMARY"
          echo "mod_version=${{ steps.meta.outputs.mod_version }}" > report/jar-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: report-jar
          path: report/
      - uses: actions/upload-artifact@v4
        with:
          name: vivecraft-jar
          path: ${{ steps.meta.outputs.jar }}
          if-no-files-found: error

  # ImmersiveMC (immersivemc/, vendored) for Fabric, compiled against the Vivecraft jar built above; the APK bundles it.
  immersivemc:
    needs: vivecraft
    runs-on: ubuntu-latest
    outputs:
      mod_version: ${{ steps.meta.outputs.mod_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
          add-job-summary: never
      - uses: actions/download-artifact@v4
        with:
          name: vivecraft-jar
          path: vcjar
      - name: Build Fabric jar against our Vivecraft
        working-directory: immersivemc
        run: |
          set -o pipefail
          vc=$(ls "$GITHUB_WORKSPACE"/vcjar/*.jar | head -1)
          echo "Vivecraft: $vc"
          bash ./gradlew :fabric:build --no-daemon -Pvivecraft_jar="$vc" 2>&1 | tee ../build.log || {
            echo "=== BUILD ERRORS ==="
            grep -E '\.java:[0-9]+: error:|^e: |What went wrong|Could not (resolve|find)' -A3 ../build.log | grep -v -E '^\s+at ' | head -200
            exit 1
          }
      - name: Locate jar
        id: meta
        run: |
          v=$(grep '^mod_version=' immersivemc/gradle.properties | cut -d= -f2)
          jar=$(ls immersivemc/fabric/build/libs/*.jar | grep -v -E -- '-(sources|dev|dev-shadow)\.jar$' | head -1)
          echo "mod_version=$v" >> "$GITHUB_OUTPUT"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          mkdir -p report
          {
            echo "immersivemc_version=$v"
            echo "immersivemc_jar=$(basename "$jar") $(stat -c %s "$jar") bytes"
            echo "immersivemc_depends=$(unzip -p "$jar" fabric.mod.json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("depends"))')"
            echo "immersivemc_nested=$(unzip -Z1 "$jar" 'META-INF/jars/*' 2>/dev/null | tr '\n' ' ')"
            echo "immersivemc_manifest_mc=$(unzip -p "$jar" META-INF/MANIFEST.MF | tr -d '\r' | sed -n 's/^Fabric-Minecraft-Version: //p')"
          } | tee report/immersivemc.txt
          { echo "### ImmersiveMC \`$v\`"; echo '```'; cat report/immersivemc.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: report-immersivemc
          path: report/
      - uses: actions/upload-artifact@v4
        with:
          name: immersivemc-jar
          path: ${{ steps.meta.outputs.jar }}
          if-no-files-found: error

  # Launches the dev client (Fabric + Sodium + our Vivecraft) under Xvfb with software GL, VR on via the
  # headset-less NULLVR provider, quick-plays into a flat world, and fails on crashes or mixin errors.
  # Desktop GL, not the headset's GL ES/OpenXR path: it proves startup, VR init, menu world and a world
  # join, not headset behaviour.
  smoke:
    name: smoke (${{ matrix.variant }})
    needs: immersivemc
    # the two variants without ImmersiveMC run even when its build failed
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # fixes-on: our defaults and our launcher's JVM heap policy.
        # fixes-off: every claudecraft toggle off (= the original Vivecraft code paths) and QuestCraft-like JVM flags.
        # fixes-on-immersivemc: fixes-on plus our ImmersiveMC jar in the dev client's mods folder (Fabric Loader
        # remaps it from intermediary at startup).
        variant: [fixes-on, fixes-off, fixes-on-immersivemc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
          add-job-summary: never
      - name: Packages
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-utils
      - name: Generate a flat test world with the vanilla server
        run: |
          mkdir -p srv && cd srv
          url=$(curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | python3 -c 'import json,sys; print([v["url"] for v in json.load(sys.stdin)["versions"] if v["id"]=="1.21.5"][0])')
          curl -fsSL -o server.jar "$(curl -fsSL "$url" | python3 -c 'import json,sys; print(json.load(sys.stdin)["downloads"]["server"]["url"])')"
          echo eula=true > eula.txt
          printf 'level-name=smoke\nlevel-type=minecraft\\:flat\nonline-mode=false\ngenerate-structures=false\n' > server.properties
          touch server.log
          { timeout 300 bash -c 'until grep -q "Done (" server.log; do sleep 2; done'; echo stop; } | timeout 400 java -Xmx2G -jar server.jar nogui > server.log 2>&1 || true
          tail -5 server.log
          test -f smoke/level.dat
          mkdir -p ../vivecraft/fabric/run/saves ../vivecraft/fabric/run/config
          cp -r smoke ../vivecraft/fabric/run/saves/smoke
      - uses: actions/download-artifact@v4
        if: matrix.variant == 'fixes-on-immersivemc'
        with:
          name: immersivemc-jar
          path: immersivemc-jar
      - name: ImmersiveMC into the dev client's mods folder
        if: matrix.variant == 'fixes-on-immersivemc'
        run: |
          mkdir -p vivecraft/fabric/run/mods
          cp immersivemc-jar/*.jar vivecraft/fabric/run/mods/
          ls -l vivecraft/fabric/run/mods
      - name: Client config (VR on via NULLVR)
        working-directory: vivecraft/fabric/run
        run: |
          printf 'onboardAccessibility:false\nrenderDistance:4\nsimulationDistance:5\npauseOnLostFocus:false\nnarrator:0\ntutorialStep:none\nskipMultiplayerWarning:true\nsoundCategory_master:0.0\n' > options.txt
          if [ "${{ matrix.variant }}" = fixes-off ]; then
            off='"freeMenuWorldInGame":"false","shareOutlineTargets":"false","lazyAuxBuffers":"false","fixSupporterLeak":"false","clearTrackerRefs":"false","xrStartupRetry":"false","xrSessionStateHandling":"false","xrLateFrameWait":"false","cacheInputOrigins":"false","glErrorChecks":"true","ltwLinearFilterFix":"false","xrRefreshRate":"MAX",'
          else
            off=''
          fi
          printf '{%s"vrEnabled":"true","rememberVr":"true","stereoProviderPluginID":"NULLVR","alwaysShowUpdates":"false"}\n' "$off" > config/vivecraft-client-config.json
          cat config/vivecraft-client-config.json
      - name: Run client, join the world, wait for the 60 s memory line
        working-directory: vivecraft
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          # JVM heap policy, like QuestCraft's launcher would start the game (ZGC either way)
          if [ "${{ matrix.variant }}" = fixes-off ]; then
            export JAVA_TOOL_OPTIONS="-XX:+UseZGC -XX:+ZGenerational -XX:-ZProactive -Xms1024m -Xmx2048m"
          else
            export JAVA_TOOL_OPTIONS="-XX:+UseZGC -XX:+ZGenerational -XX:-ZProactive -Xms512m -Xmx2048m -XX:SoftMaxHeapSize=1536m -XX:ZUncommitDelay=30"
          fi
          # JAVA_TOOL_OPTIONS reaches every JVM here. gradlew starts its wrapper with -Xmx64m, which the JVM rejects
          # next to SoftMaxHeapSize=1536m, so give the wrapper a heap the flags fit in.
          export GRADLE_OPTS="-Xmx2048m"
          mkdir -p ../report
          # sample the game process (not Gradle) every 2 s: time, RSS kB, PSS kB
          ( while true; do
              pid=""
              for p in $(pgrep java); do
                tr '\0' ' ' < /proc/$p/cmdline 2>/dev/null | grep -q -E 'GradleDaemon|GradleWrapperMain|GradleWorkerMain|KotlinCompileDaemon' || pid=$p
              done
              if [ -n "$pid" ]; then
                echo "$(date +%s) $(awk '/^VmRSS/{print $2}' /proc/$pid/status 2>/dev/null) $(awk '/^Pss:/{print $2}' /proc/$pid/smaps_rollup 2>/dev/null)" >> ../report/rss-samples.txt
              fi
              sleep 2
            done ) &
          sampler=$!
          xvfb-run -a -s "-screen 0 1280x720x24" bash ./gradlew :fabric:runClient --no-daemon --args="--quickPlaySingleplayer smoke" > client.log 2>&1 &
          client=$!
          probe=0; grep -rq 'class PerfProbe' common/src && probe=1
          for i in $(seq 1 180); do
            sleep 5
            if grep -q 'label=join+60s' client.log; then echo "reached join+60s"; break; fi
            if [ $probe = 0 ] && [ $i -ge 60 ]; then echo "no PerfProbe in this build: stopping after 300 s"; break; fi
            if grep -q -E 'Crash report saved|---- Minecraft Crash Report|BUILD FAILED' client.log; then echo "crash or build failure"; break; fi
            if ! kill -0 $client 2>/dev/null; then echo "client exited"; break; fi
          done
          sleep 5
          kill $sampler || true
          pkill -f 'net.fabricmc' || true; pkill -f GradleWrapperMain || true; sleep 5; pkill -9 java || true
      - name: Evaluate
        if: always()
        working-directory: vivecraft
        run: |
          log=fabric/run/logs/latest.log; [ -f "$log" ] || log=client.log
          {
            echo "### Smoke test (NULLVR, software GL)"
            echo '```'
            grep -E '\[VCPERF\]' "$log" | cut -c1-400 | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          if ls fabric/run/crash-reports/*.txt >/dev/null 2>&1; then echo "::error::crash report written"; head -60 fabric/run/crash-reports/*.txt; fail=1; fi
          if grep -n -E 'Mixin apply .*failed|MixinApplyError|InvalidInjectionException|Mixin transformation of .* failed' "$log" client.log; then echo "::error::mixin failure"; fail=1; fi
          if grep -n 'Failed to initialize VR' "$log"; then echo "::error::VR init failed"; fail=1; fi
          if grep -q 'BUILD FAILED' client.log; then echo "::error::build failed"; grep -E '\.java:[0-9]+: error:' -A2 client.log | head -60; fail=1; fi
          if grep -rq 'class PerfProbe' common/src; then
            grep -q '\[VCPERF\] config' "$log" || { echo "::error::no [VCPERF] config line (VR did not start?)"; fail=1; }
            grep -q 'label=join+60s' "$log" || { echo "::error::did not stay in the world for 60 s"; fail=1; }
          fi
          if [ "${{ matrix.variant }}" = fixes-on-immersivemc ]; then
            grep -q -E '\[VCPERF\] config .*immersivemc=[0-9]' "$log" || { echo "::error::ImmersiveMC not loaded"; fail=1; }
          fi
          mkdir -p ../report && exec > >(tee ../report/smoke-${{ matrix.variant }}.txt) 2>&1
          echo "=== SUMMARY (smoke ${{ matrix.variant }}) ==="
          awk 'NF==3 && $2>r{r=$2} NF==3 && $3>p{p=$3} END{printf "memory: peak RSS %d MB, peak PSS %d MB, %d samples\n", r/1024, p/1024, NR}' ../report/rss-samples.txt 2>/dev/null || true
          grep -o -E 'label=(vr_init|join|join\+60s|leave) heapUsed=[0-9-]+M heapCommitted=[0-9-]+M heapMax=[0-9-]+M metaspace=[0-9-]+M classSpace=[0-9-]+M codeCache=[0-9-]+M direct=[0-9-]+M VmRSS=[0-9]+M' "$log" | head -6 || true
          echo "VR init: $(grep -c -E 'Vivecraft: (Garbage collector|OpenXR|NullVR)|\[VCPERF\] config' "$log") | world joined: $(grep -c -E 'joined the game|Loaded [0-9]+ advancements|label=join ' "$log") | VCPERF lines: $(grep -c '\[VCPERF\]' "$log") | errors: $(grep -c -E 'ERROR\]' "$log")"
          grep -E '\[VCPERF\] (config|mem label=(vr_init|join|join\+60s|leave))' "$log" | cut -c1-330 | head -8 || true
          grep -n -E 'ERROR\]|Exception' "$log" | grep -v -i -E 'sound|openal|realms|telemetry|narrator' | cut -c1-250 | head -15 || true
          # ImmersiveMC registers its Vivecraft interact modules once; show where a duplicate comes from
          grep -n -B3 -A14 'is already added and should not be added again' "$log" | cut -c1-220 | head -40 || true
          [ -f fabric/run/logs/latest.log ] || { echo "no game log; end of client.log:"; tail -25 client.log | cut -c1-300; }
          echo "=== END SUMMARY (fail=$fail) ==="
          exit $fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs-${{ matrix.variant }}
          path: |
            report/
            vivecraft/client.log
            vivecraft/fabric/run/logs/
            vivecraft/fabric/run/crash-reports/
          if-no-files-found: ignore

  apk:
    needs: [vivecraft, immersivemc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: vivecraft-jar
          path: jar
      - uses: actions/download-artifact@v4
        with:
          name: immersivemc-jar
          path: imc
      - name: Tools (apktool, dex2jar)
        run: |
          mkdir -p tools-bin && cd tools-bin
          curl -fsSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          curl -fsSL -o dex2jar.zip https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip
          unzip -q dex2jar.zip
          d2j=$(find "$PWD" -name d2j-dex2jar.sh | head -1); chmod +x "$(dirname "$d2j")"/*.sh
          echo "APKTOOL_JAR=$PWD/apktool.jar" >> "$GITHUB_ENV"
          echo "DEX2JAR=$d2j" >> "$GITHUB_ENV"
      - name: Fetch the QuestCraft APK
        env:
          GH_TOKEN: ${{ github.token }}
          APK_URL: ${{ inputs.qc_apk_url }}
          QC_TAG: ${{ inputs.qc_release_tag }}
        run: |
          mkdir -p qc
          if [ -n "$APK_URL" ]; then
            curl -fsSL -o qc/questcraft.apk "$APK_URL"
            src="$APK_URL"
          else
            gh release list -R "$QC_REPO" -L 10
            tag="${QC_TAG:-$(gh release view -R "$QC_REPO" --json tagName -q .tagName)}"
            gh release view "$tag" -R "$QC_REPO" --json assets -q '.assets[].name'
            gh release download "$tag" -R "$QC_REPO" -p '*.apk' -D qc
            src="$QC_REPO release $tag"
          fi
          apk=$(ls qc/*.apk | head -1)
          echo "QC_APK=$apk" >> "$GITHUB_ENV"
          { echo "### QuestCraft APK"; echo "- source: $src"; echo "- file: \`$(basename "$apk")\`"; echo "- sha256: \`$(sha256sum "$apk" | cut -d' ' -f1)\`"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Build APK (replace variant)
        run: apk/build-apk.sh --apk "$QC_APK" --jar jar/*.jar --immersivemc imc/*.jar --variant replace --out out --tag "${{ needs.vivecraft.outputs.mod_version }}"
      - name: Build APK (side-by-side variant)
        continue-on-error: true
        run: apk/build-apk.sh --apk "$QC_APK" --jar jar/*.jar --immersivemc imc/*.jar --variant side --out out --tag "${{ needs.vivecraft.outputs.mod_version }}"
      - name: Report
        if: always()
        run: |
          cat out/patch-report-*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          ls -l out jar imc | tee -a "$GITHUB_STEP_SUMMARY"
          echo "=== SUMMARY (apk) ==="; cat out/patch-report-replace.md 2>/dev/null; cat out/*.sha256 2>/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: questcraft-claudecraft-apk
          path: |
            out/*.apk
            out/*.sha256
            out/*.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-apk
          path: |
            out/*.md
            out/*.sha256
            out/shipped-smali/
          if-no-files-found: ignore
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --prerelease --title "$GITHUB_REF_NAME" \
            --notes "Personal sideload build. See perf/RESULTS.md and the test script in the repo." \
            out/*.apk out/*.sha256 jar/*.jar imc/*.jar

  # One short block with every job's key results, so it can be read without the long job logs.
  report:
    needs: [vivecraft, immersivemc, smoke, apk]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: r
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: smoke-logs-*
          path: s
        continue-on-error: true
      - name: Summary
        run: |
          echo "=== REPORT ==="
          echo "jobs: vivecraft=${{ needs.vivecraft.result }} immersivemc=${{ needs.immersivemc.result }} smoke=${{ needs.smoke.result }} apk=${{ needs.apk.result }}"
          cat r/jar-version.txt 2>/dev/null || true
          cat r/immersivemc.txt 2>/dev/null || true
          grep -E '^- ' r/jar-compare.md 2>/dev/null | head -4 || true
          for f in s/*/report/smoke-*.txt; do sed -n '/=== SUMMARY/,/=== END SUMMARY/p' "$f" | cut -c1-400; done 2>/dev/null || echo "(no smoke summary)"
          cat r/patch-report-replace.md 2>/dev/null | head -30 || true
          sed -n '/^## Bundled/,$p' r/patch-report-replace.md 2>/dev/null || true
          cat r/*.sha256 2>/dev/null || true
          echo "=== END REPORT ==="
